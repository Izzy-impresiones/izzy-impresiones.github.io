name: Copiar fotos al repositorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/productos.json"

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar fotos
        run: python tools/copiar_fotos.py
      - name: Guardar cambios
        run: |
          git config user.name "izzy-bot"
          git config user.email "izzy-bot@users.noreply.github.com"
          git add -A img brand data
          if git diff --cached --quiet; then
            echo "Nada para guardar"
          else
            git commit -m "Copiar fotos de productos al repositorio"
            git push
          fi
