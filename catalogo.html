<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo | Izzy Impresiones 3D</title>
<meta name="description" content="Explorá los productos de Izzy: hogar, organización, decoración, regalos y más, impresos en 3D en Corrientes Capital.">
<meta name="theme-color" content="#f1e6d6">
<link rel="icon" href="brand/izzy-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js" defer></script>
</head>
<body data-page="catalogo">
<main id="contenido"><div class="container">
  <div class="cat-head">
    <span class="eyebrow">Hechos para tu día a día</span>
    <h1>Encontrá tu próximo favorito.</h1>
    <p class="lead">Formas simples. Objetos con personalidad. Elegí el tuyo.</p>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input class="search" id="search" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
      <select class="sort" id="sort" aria-label="Ordenar">
        <option value="sugerido">Orden sugerido</option>
        <option value="nuevos">Más nuevos</option>
        <option value="menor">Menor precio</option>
        <option value="mayor">Mayor precio</option>
      </select>
    </div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div></main>
</body>
</html>
